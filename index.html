<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandemie Scenario Spel</title>

  <link href="https://fonts.googleapis.com/css2?family=Arial&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #dbe7f0;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 350px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #4a8fd1;
      border: none;
      color: white;
      border-radius: 8px;
      width: 100%;
    }

    button:active {
      background-color: #3c7db5;
    }

    .site-footer {
      margin-top: 16px;
      background: #ffffff;
      width: 90%;
      max-width: 350px;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      font-size: 0.75rem;
      color: #555;
text-align: left;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Welkom in het pandemie-scenario-spel</h1>

    <img src="afb1virus.png" alt="Virus">

    <button onclick="window.location.href='uitleg.html'">Speluitleg</button>
    <br><br>
    <button onclick="window.location.href='scenario1.html'">Start het spel</button>
  </div>

  <footer class="site-footer" role="contentinfo">
    © 2025 Huisartsopleiding Utrecht. Alle rechten voorbehouden.
    Niets uit deze game/website mag worden verveelvoudigd, opgeslagen
    of openbaar gemaakt zonder voorafgaande schriftelijke toestemming
    van Huisartsopleiding Utrecht.
  </footer>

</body>
</html>
